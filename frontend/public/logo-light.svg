<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @font-face { font-family: 'LogoOswald'; font-weight: 700; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'LogoMontserrat'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }
      .brand { font-family: 'LogoOswald', 'Arial Narrow', Impact, sans-serif; font-weight: 700; }
      .tag { font-family: 'LogoMontserrat', 'Segoe UI', Arial, sans-serif; font-weight: 600; }
    </style>

    <radialGradient id="bg" cx="50%" cy="35%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceefb"/>
    </radialGradient>

    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6206e"/>
      <stop offset="0.55" stop-color="#ef3b2d"/>
      <stop offset="1" stop-color="#f26b1d"/>
    </linearGradient>

    <linearGradient id="beamOrange" gradientUnits="userSpaceOnUse" x1="150" y1="130" x2="262" y2="236">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamBlue" gradientUnits="userSpaceOnUse" x1="362" y1="130" x2="250" y2="236">
      <stop offset="0" stop-color="#22a8f2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4f56e8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2352b"/>
      <stop offset="1" stop-color="#a11f1f"/>
    </linearGradient>

    <clipPath id="badge"><circle cx="256" cy="256" r="244"/></clipPath>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="247" fill="none" stroke="#dfe2ee" stroke-width="5"/>

  <g clip-path="url(#badge)">
    <!-- Halo + rayons -->
    <ellipse cx="256" cy="186" rx="160" ry="110" fill="url(#glow)"/>
    <g stroke-linecap="round" stroke-width="5" opacity="0.4">
      <line x1="256" y1="190" x2="256" y2="58" stroke="#ff5a36"/>
      <line x1="256" y1="190" x2="214" y2="66" stroke="#ff7a2f"/>
      <line x1="256" y1="190" x2="298" y2="66" stroke="#ff7a2f"/>
    </g>

    <!-- Faisceaux croisés -->
    <polygon points="146,138 176,116 290,226 236,236" fill="url(#beamOrange)"/>
    <polygon points="366,138 336,116 222,226 276,236" fill="url(#beamBlue)"/>

    <!-- Projecteurs (lyres) -->
    <g transform="translate(152 116) rotate(-42)">
      <path d="M-26 -30 h52 v12 h-10 v22 h-32 v-22 h-10 z" fill="#7f1d1d"/>
      <rect x="-21" y="-4" width="42" height="38" rx="9" fill="url(#body)" stroke="#5c1414" stroke-width="3"/>
      <ellipse cx="0" cy="34" rx="17" ry="6" fill="#ffb25c"/>
    </g>
    <g transform="translate(360 116) rotate(42)">
      <path d="M-26 -30 h52 v12 h-10 v22 h-32 v-22 h-10 z" fill="#7f1d1d"/>
      <rect x="-21" y="-4" width="42" height="38" rx="9" fill="url(#body)" stroke="#5c1414" stroke-width="3"/>
      <ellipse cx="0" cy="34" rx="17" ry="6" fill="#8fd6ff"/>
    </g>

    <!-- Enceintes -->
    <g transform="translate(114 350)">
      <rect x="0" y="0" width="70" height="100" rx="9" fill="url(#body)" stroke="#5c1414" stroke-width="3"/>
      <circle cx="35" cy="24" r="11" fill="#3b2a3f" stroke="#f26b1d" stroke-width="3"/>
      <circle cx="35" cy="68" r="24" fill="#3b2a3f" stroke="#f26b1d" stroke-width="4"/>
      <circle cx="35" cy="68" r="13" fill="none" stroke="#6a5670" stroke-width="3"/>
      <circle cx="35" cy="68" r="5" fill="#6a5670"/>
    </g>
    <g transform="translate(328 350)">
      <rect x="0" y="0" width="70" height="100" rx="9" fill="url(#body)" stroke="#5c1414" stroke-width="3"/>
      <circle cx="35" cy="24" r="11" fill="#3b2a3f" stroke="#22a8f2" stroke-width="3"/>
      <circle cx="35" cy="68" r="24" fill="#3b2a3f" stroke="#22a8f2" stroke-width="4"/>
      <circle cx="35" cy="68" r="13" fill="none" stroke="#6a5670" stroke-width="3"/>
      <circle cx="35" cy="68" r="5" fill="#6a5670"/>
    </g>

    <!-- Égaliseur -->
    <g transform="translate(256 444)" stroke-linecap="round" stroke-width="11">
      <line x1="-50" y1="0" x2="-50" y2="-20" stroke="#f26b1d"/>
      <line x1="-30" y1="0" x2="-30" y2="-42" stroke="#ef3b2d"/>
      <line x1="-10" y1="0" x2="-10" y2="-28" stroke="#e6206e"/>
      <line x1="10" y1="0" x2="10" y2="-50" stroke="#4f56e8"/>
      <line x1="30" y1="0" x2="30" y2="-32" stroke="#22a8f2"/>
      <line x1="50" y1="0" x2="50" y2="-16" stroke="#22a8f2"/>
    </g>
  </g>

  <!-- Texte -->
  <text x="256" y="298" text-anchor="middle" class="brand" font-size="80" letter-spacing="1"
        fill="url(#brandGrad)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" paint-order="stroke">MATT'EVENTS</text>
  <text x="256" y="338" text-anchor="middle" class="tag" font-size="22" letter-spacing="5"
        fill="#1e8fe0">SOUND &amp; LIGHT</text>
</svg>
