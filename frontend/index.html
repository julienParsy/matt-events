<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Location sono &amp; lumière pour vos événements – Matt'events</title>


  <!-- META SEO de base (chaque page les précise ensuite : voir src/components/Canonical.jsx) -->
  <meta name="description"
    content="Location de sonorisation et d'éclairage près de Lille : enceintes, lyres, lasers, machines à fumée et packs clé en main pour mariages, soirées, concerts et fêtes d'entreprise. Devis gratuit." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://www.mattevents.fr/" />
  <meta name="theme-color" content="#1a1a1a" />

  <!-- Partage (Facebook, WhatsApp, Messenger, LinkedIn…) : lu sans exécuter le JavaScript -->
  <meta property="og:site_name" content="Matt'events" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Location sono &amp; lumière pour vos événements – Matt'events" />
  <meta property="og:description" content="Enceintes, lumières, effets et packs clé en main pour mariages, soirées, concerts et fêtes d'entreprise, près de Lille." />
  <meta property="og:url" content="https://www.mattevents.fr/" />
  <meta property="og:image" content="https://www.mattevents.fr/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Matt'events, location de sonorisation et d'éclairage" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Fiche entreprise pour Google (résultats enrichis, recherches locales) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Matt'events",
    "description": "Location de matériel de sonorisation et d'éclairage pour mariages, soirées, concerts et fêtes d'entreprise.",
    "url": "https://www.mattevents.fr/",
    "image": "https://www.mattevents.fr/og-image.jpg",
    "logo": "https://www.mattevents.fr/logo-light.png",
    "email": "contact@mattevents.fr",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "57 rue Hubert Parent prolongée",
      "postalCode": "59171",
      "addressLocality": "Erre",
      "addressCountry": "FR"
    },
    "areaServed": "Hauts-de-France"
  }
  </script>

  <!-- tiny -->
  <meta name="referrer" content="origin">

  <!-- Thème : appliqué avant le premier affichage pour éviter un flash (voir src/hooks/useTheme.js) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>


</head>

<body>
  <div id="root"></div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
