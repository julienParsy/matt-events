# Scripts d'installation autorisés (pnpm les bloque par défaut, par sécurité)
allowBuilds:
  # Nécessaires à la compilation du site (Vite et Tailwind)
  esbuild: true
  '@tailwindcss/oxide': true
  # Inutiles pour le site : non exécutés
  '@firebase/util': false
  protobufjs: false

# Versions corrigées de dépendances indirectes (failles connues)
overrides:
  '@grpc/grpc-js': '>=1.13.6 <2'
